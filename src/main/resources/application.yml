spring:
  application:
    name: ticketmaster

  datasource:
    url: jdbc:mariadb://localhost:3306/ticketmaster
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  address: 0.0.0.0
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

paychangu:
  secret-key: ${PAYCHANGU_SECRET_KEY}
  base-url: ${PAYCHANGU_BASE_URL:https://api.paychangu.com}
  callback-url: ${PAYCHANGU_CALLBACK_URL:http://localhost:8080/api/payments/callback}
  return-url: ${PAYCHANGU_RETURN_URL:http://localhost:8080/api/payments/return}
  webhook-secret: ${PAYCHANGU_WEBHOOK_SECRET:}
  
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO

app:
  payment:
    app-redirect-uri: ${APP_PAYMENT_REDIRECT_URI:myapp://payment-result}
  registration:
    allow-privileged-roles: false
  demo-payment:
    enabled: false
  orders:
    max-tickets-per-order: 10
    pending-minutes: 30
  uploads-dir: uploads
  seed:
    enabled: false