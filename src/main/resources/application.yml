spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ticketmaster

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/ticketmaster}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  address: 0.0.0.0
  port: 8082

jwt:
  # Local development fallback only; override with a unique random secret in every deployed environment.
  secret: ${JWT_SECRET:local-development-only-jwt-secret-key-do-not-use-in-production-2026}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

paychangu:
  secret-key: ${PAYCHANGU_SECRET_KEY:}
  base-url: ${PAYCHANGU_BASE_URL:https://api.paychangu.com}
  callback-url: ${PAYCHANGU_CALLBACK_URL:http://localhost:8082/api/payments/callback}
  return-url: ${PAYCHANGU_RETURN_URL:http://localhost:8082/api/payments/return}
  webhook-secret: ${PAYCHANGU_WEBHOOK_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO

app:
  payment:
    app-redirect-uri: ${APP_PAYMENT_REDIRECT_URI:myapp://payment-result}
  registration:
    allow-privileged-roles: false
  demo-payment:
    enabled: false
    base-url: ${APP_DEMO_PAYMENT_BASE_URL:http://localhost:8082}
  orders:
    max-tickets-per-order: 10
    pending-minutes: 30
  uploads-dir: uploads
  seed:
    enabled: false
